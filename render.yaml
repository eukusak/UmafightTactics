# New services: keep the existing combined service live until both are verified.
# Do not convert a Node service to static or change the live service's region.
services:
  - type: web
    name: umafight-frontend
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_MULTIPLAYER_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /bundled/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache
  - type: web
    name: umafight-multiplayer
    runtime: node
    region: singapore
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_SERVER_METRICS
        value: "true"
