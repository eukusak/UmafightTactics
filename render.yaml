services:
  - type: web
    name: umafight-tactics
    runtime: static
    buildCommand: npm ci && npm run verify
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
