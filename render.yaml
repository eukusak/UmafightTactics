# A persistent Node web process is required for WebSocket rooms.
# Existing Static Sites must be recreated as a Web Service to enable multiplayer.
services:
  - type: web
    name: umafight-tactics
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=1024"
