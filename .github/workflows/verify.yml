name: Verify game build

# The deploy build only compiles the site, so the full gate lives here:
# data generation, schema checks, tests, a balance simulation and the bundle.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Regenerate data and check it is unchanged
        # The generated JSON is committed, so a rebuild must be a no-op.
        # A diff here means someone edited it by hand or changed the pipeline
        # without committing the result.
        run: |
          npm run sync:data
          npm run data:build
          npm run data:validate
          git diff --exit-code -- src/data/generated src/data/source public/assets/traits

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Balance simulation
        run: |
          for season in s1 s2 s3 s4 s5; do
            npm run simulate -- --season "$season" --matches 40
          done

      - name: Art manifest report
        run: STRICT_ART=1 npm run check:art

      - name: Motion briefs stay aligned with skills
        run: |
          npm run art:briefs
          git diff --exit-code -- docs/art-source/motions/briefs.json

      - name: TFT comparison report (not a parity pass gate)
        run: npm run audit:tft

      - name: Build
        run: npm run build

      - name: Check production entry points and WebSocket rooms
        run: node --test tests/support/production-start.mjs tests/support/startup-paths.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install browser for season UI checks
        run: npx playwright install --with-deps chromium
      - name: Season UI, artwork and online smoke checks
        run: npm run test:ui
      - name: Save browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-ui-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
