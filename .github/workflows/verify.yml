name: Verify game build

# The deploy build only compiles the site, so the full gate lives here:
# data generation, schema checks, tests, a balance simulation and the bundle.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Regenerate data and check it is unchanged
        # The generated JSON is committed, so a rebuild must be a no-op.
        # A diff here means someone edited it by hand or changed the pipeline
        # without committing the result.
        run: |
          npm run sync:data
          npm run data:build
          npm run data:validate
          git diff --exit-code -- src/data/generated src/data/source public/assets/traits

      - name: Race plan catalogue and budget diagnostic
        run: npm run audit:race-plan

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Art manifest report
        run: STRICT_ART=1 npm run check:art

      - name: Motion briefs stay aligned with skills
        run: |
          npm run art:briefs
          git diff --exit-code -- docs/art-source/motions/briefs.json

      - name: TFT comparison report (not a parity pass gate)
        run: npm run audit:tft

      - name: Render Yarn install hook builds before runtime
        # Exercise the legacy Render lifecycle with a small inherited heap.
        # Dependencies remain installed from package-lock.json by npm ci above.
        run: |
          npm exec --yes --package=yarn@1.22.22 -- env -u npm_execpath yarn run test:render-install
          npm exec --yes --package=yarn@1.22.22 -- env -u npm_execpath yarn run postinstall
        env:
          RENDER: "true"
          NODE_OPTIONS: --max-old-space-size=256

      - name: Clean production-only server install
        run: npm run test:server-install

      - name: Check initial bundle boundary
        run: npm run check:bundle

      - name: Multiplayer transport load smoke
        run: npm run test:load -- --rooms 1 --players 8 --seconds 3

      - name: Check production entry points and WebSocket rooms
        # Both files probe a free TCP port before spawning the production entry.
        # Run them serially so neither suite reclaims the other's released port.
        run: node --test --test-concurrency=1 tests/support/production-start.mjs tests/support/startup-paths.mjs

  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        season: [s1, s2, s3, s4, s5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - name: Install
        run: npm ci
      # Keep all 200 matches while evaluating the more detailed AI per season.
      - name: Balance simulation
        run: npm run simulate -- --season "${{ matrix.season }}" --matches 40

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install browser for season UI checks
        run: npx playwright install --with-deps chromium
      - name: Season UI, artwork and online smoke checks
        run: npm run test:ui
      - name: Save browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-ui-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
