name: Verify game build

# The deploy build only compiles the site, so the full gate lives here:
# data generation, schema checks, tests, a balance simulation and the bundle.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Regenerate data and check it is unchanged
        # The generated JSON is committed, so a rebuild must be a no-op.
        # A diff here means someone edited it by hand or changed the pipeline
        # without committing the result.
        run: |
          npm run sync:data
          npm run data:build
          npm run data:validate
          git diff --exit-code -- src/data/generated src/data/source

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Balance simulation
        run: npm run simulate -- --matches 200

      - name: Art manifest report
        run: npm run check:art

      - name: Build
        run: npm run build

      - name: Serve the build and check it responds
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then
              echo "server responded"
              curl -fsS -o /dev/null -w 'deep link: %{http_code}\n' http://127.0.0.1:4173/some/route
              exit 0
            fi
            sleep 2
          done
          echo "server did not respond in time" >&2
          exit 1
