name: Recover UmaRefs incomplete race images

on:
  push:
    branches: ["sync/umarefs-fast"]
    paths:
      - ".github/workflows/sync-umarefs-fast.yml"
      - "tools/sync_umarefs_incomplete.py"
      - "requirements-umarefs.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-incomplete:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-umarefs.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-umarefs.txt
          python -m playwright install --with-deps chromium

      - name: Physically click incomplete cards and recover Race PNGs
        run: python tools/sync_umarefs_incomplete.py

      - name: Guard against GitHub single-file limit
        shell: bash
        run: |
          oversized="$(find public/assets/characters/race -type f -size +95M -print || true)"
          if [ -n "$oversized" ]; then
            echo "$oversized"
            exit 1
          fi

      - name: Commit recovered incomplete images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/characters/race
          if git diff --cached --quiet; then
            echo "No incomplete-image changes to commit."
            exit 0
          fi
          git commit -m "chore: recover incomplete UmaRefs Race images"
          git push origin HEAD:sync/umarefs-fast
